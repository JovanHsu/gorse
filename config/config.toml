[database]

# 缓存数据库，支持 Redis、MySQL、Postgres 和 MongoDB：
#   redis://<user>:<password>@<host>:<port>/<db_number>
#   rediss://<user>:<password>@<host>:<port>/<db_number>
#   redis+cluster://<user>:<password>@<host>:<port>[?addr=<host2>:<port2>&addr=<host3>:<port3>]
#   rediss+cluster://<user>:<password>@<host>:<port>[?addr=<host2>:<port2>&addr=<host3>:<port3>]
#   mysql://[username[:password]@][protocol[(address)]]/dbname[?param1=value1&...&paramN=valueN]
#   postgres://bob:secret@1.2.3.4:5432/mydb?sslmode=verify-full
#   postgresql://bob:secret@1.2.3.4:5432/mydb?sslmode=verify-full
#   mongodb://[username:password@]host1[:port1][,...hostN[:portN]][/[defaultauthdb][?options]]
#   mongodb+srv://[username:password@]host1[:port1][,...hostN[:portN]][/[defaultauthdb][?options]]
#   sqlite://<path>
cache_store = "redis://localhost:6379/0"

# 数据持久化数据库，支持 MySQL、Postgres、ClickHouse 和 MongoDB：
#   mysql://[username[:password]@][protocol[(address)]]/dbname[?param1=value1&...&paramN=valueN]
#   postgres://bob:secret@1.2.3.4:5432/mydb?sslmode=verify-full
#   postgresql://bob:secret@1.2.3.4:5432/mydb?sslmode=verify-full
#   clickhouse://user:password@host[:port]/database?param1=value1&...&paramN=valueN
#   chhttp://user:password@host[:port]/database?param1=value1&...&paramN=valueN
#   chhttps://user:password@host[:port]/database?param1=value1&...&paramN=valueN
#   mongodb://[username:password@]host1[:port1][,...hostN[:portN]][/[defaultauthdb][?options]]
#   mongodb+srv://[username:password@]host1[:port1][,...hostN[:portN]][/[defaultauthdb][?options]]
#   sqlite://<path>
data_store = "mysql://gorse:gorse_pass@tcp(localhost:3306)/gorse"

# 数据库中表（集合、键）的命名前缀。默认为空。
table_prefix = ""

# 缓存存储数据库中表（集合、键）的命名前缀。默认为 `table_prefix`。
cache_table_prefix = ""

# 数据存储数据库中表（集合、键）的命名前缀。默认为 `table_prefix`。
data_table_prefix = ""

[database.mysql]

# 事务隔离级别。默认为 "READ-UNCOMMITTED"。
isolation_level = "READ-UNCOMMITTED"

# 数据库最大打开连接数。设为 0 使用驱动默认值。
max_open_conns = 0

# 数据库最大空闲连接数。设为 0 使用驱动默认值。
max_idle_conns = 0

# 连接最大复用时间。设为 "0s" 使用驱动默认值。
conn_max_lifetime = "0s"

[database.postgres]

# 数据库最大打开连接数。默认为 64。
max_open_conns = 64

# 数据库最大空闲连接数。默认为 64。
max_idle_conns = 64

# 连接最大复用时间。默认为 "1m"。
conn_max_lifetime = "1m"

[database.redis]

# FT.SEARCH 命令使用 LIMIT 时返回的最大结果数。
max_search_results = 10000

[master]

# Master 节点的 gRPC 端口。默认为 8086。
port = 8086

# Master 节点的 gRPC 主机地址。默认为 "0.0.0.0"。
host = "0.0.0.0"

# 启用 gRPC 通信的 SSL。默认为 false。
ssl_mode = false

# gRPC 通信的 SSL 证书颁发机构。
ssl_ca = ""

# gRPC 通信的 SSL 证书。
ssl_cert = ""

# gRPC 通信的 SSL 证书私钥。
ssl_key = ""

# Master 节点的 HTTP 端口。默认为 8088。
http_port = 8088

# Master 节点的 HTTP 主机地址。默认为 "0.0.0.0"。
http_host = "0.0.0.0"

# 允许的 Http Origin 值的列表。
# 可包含特殊通配符字符串 ".*" 表示允许所有来源。
# 为空表示允许所有来源。
http_cors_domains = []

# 允许的 HTTP 方法列表，为空表示允许所有方法。检查不区分大小写。
http_cors_methods = []

# Master 节点的工作线程数。默认为 1。
n_jobs = 1

# 元信息超时时间。默认为 10s。
meta_timeout = "10s"

# Master 节点仪表板的登录用户名。
dashboard_user_name = ""

# Master 节点仪表板的登录密码。
dashboard_password = ""

# 管理 API 的密钥（需要 SSL）。
admin_api_key = ""

[server]

# 默认返回的物品数量。默认为 10。
default_n = 10

# RESTful API 的密钥（需要 SSL）。
api_key = ""

# 集群中的时钟误差。默认为 5s。
clock_error = "5s"

# 插入反馈时自动创建新用户。默认为 true。
auto_insert_user = true

# 插入反馈时自动创建新物品。默认为 true。
auto_insert_item = true

# 服务端缓存过期时间。默认为 10s。
cache_expire = "10s"

[recommend]

# 推荐/热门/最新物品的缓存大小。默认为 10。
cache_size = 100

# 推荐缓存过期时间。默认为 72h。
cache_expire = "72h"

# 在线推荐的上下文大小。出于效率考虑，在线推荐不会使用用户的所有反馈来生成推荐，
# 而只使用最近的 `context_size` 条反馈。默认为 100。
context_size = 100

# 活跃用户的存活时间（天），0 表示禁用。不活跃用户的推荐不会被缓存。默认为 0。
active_user_ttl = 0

[recommend.data_source]

# 正向反馈的事件类型。
positive_feedback_types = ["star","like","read>=3"]

# 已读反馈的事件类型。
read_feedback_types = ["read"]

# 正向反馈的存活时间（天），0 表示禁用。默认为 0。
positive_feedback_ttl = 0

# 物品的存活时间（天），0 表示禁用。默认为 0。
item_ttl = 0

[[recommend.non-personalized]]

# 排行榜名称。
name = "most_starred_weekly"

# 排行榜中物品的评分函数。
score = "count(feedback, .FeedbackType == 'star')"

# 排行榜中物品的过滤条件。
filter = "(now() - item.Timestamp).Hours() < 168"

[[recommend.item-to-item]]

# 物品对物品推荐器的名称。
name = "neighbors"

# 物品对物品推荐器的类型。有三种类型：
#   embedding: 通过嵌入向量的欧几里得距离推荐。
#   tags: 通过共同标签数量推荐。
#   users: 通过共同用户数量推荐。
type = "embedding"

# 物品嵌入向量的列名。如果 type 为 "users" 则留空。
column = "item.Labels.embedding"

[[recommend.user-to-user]]

# 用户对用户推荐器的名称。
name = "neighbors"

# 用户对用户推荐器的类型。有三种类型：
#   embedding: 通过嵌入向量的欧几里得距离推荐。
#   tags: 通过共同标签数量推荐。
#   items: 通过共同物品数量推荐。
type = "items"

[[recommend.external]]

# 外部推荐器的名称。
name = "trending"

# 获取外部推荐物品的脚本。脚本应返回物品 ID 列表。
script = """
const response = fetch("https://cdn.jsdelivr.net/gh/isboyjc/github-trending-api/data/daily/all.json");
if (!response.ok) {
  throw new Error(`${response.status} ${response.body}`);
}
const data = JSON.parse(response.body);
data["items"].map((item) => {
  return item["title"].toLowerCase().replace("/", ":");
})
"""

[recommend.collaborative]

# 协同过滤的类型。支持的取值：
#   none: 禁用协同过滤。
#   mf: 矩阵分解。
type = "mf"

# 模型训练的时间周期。默认为 "60m"。
fit_period = "60m"

# 模型训练的轮数。默认为 100。
fit_epoch = 100

# 超参数优化的时间周期，设为 0 表示禁用。默认为 "0"。
optimize_period = "360m"

# 超参数优化的试验次数。默认为 10。
optimize_trials = 10

[recommend.collaborative.early_stopping]

# 如果没有改进则等待的轮数，之后停止训练。默认为 10。
patience = 10

[recommend.replacement]

# 将历史物品重新插入推荐列表。默认为 false。
enable_replacement = false

# 正向反馈中重新插入物品的衰减系数。默认为 0.8。
positive_replacement_decay = 0.8

# 已读反馈中重新插入物品的衰减系数。默认为 0.6。
read_replacement_decay = 0.6

[recommend.ranker]

# 排序器的类型。有三种类型：
#   none: 不进行排序（默认）。
#   fm: 因子分解机。
#   llm: 基于 LLM 的重排序器。
type = "fm"

# 非活跃用户刷新推荐的时间周期。默认为 120h。
cache_expire = "120h"

# 排序前用于获取候选物品的推荐器。默认为所有推荐器。
recommenders = ["latest", "collaborative", "non-personalized/most_starred_weekly", "item-to-item/neighbors", "user-to-user/neighbors"]

# 模型训练的时间周期。默认为 "60m"。
fit_period = "60m"

# 模型训练的轮数。默认为 100。
fit_epoch = 100

# 超参数优化的时间周期，设为 0 表示禁用。默认为 "0"。
optimize_period = "360m"

# 超参数优化的试验次数。默认为 10。
optimize_trials = 10

# 查询的提示词模板。
query_template = """
You are a GitHub repository recommender system. Given a user is interested in the following repositories:
{% for repo in feedback -%}
- {{ repo.Comment }}
{% endfor -%}
Please sort repositories by the user's interests.
"""

# 文档的提示词模板。
document_template = '{{ item.Comment | replace(",", " ") | replace("\n", " ") }}'

[recommend.ranker.early_stopping]

# 如果没有改进则等待的轮数，之后停止训练。默认为 10。
patience = 10

[recommend.ranker.reranker_api]

# 排序器 API 的认证令牌。
auth_token = ""

# 排序器模型。
model = "qwen3-rerank"

# 排序器 API 的 URL，支持 Jina 风格。
url = "https://dashscope.aliyuncs.com/compatible-api/v1/reranks"

[recommend.fallback]

# 降级推荐器。当缓存推荐用尽时使用。默认为 ["latest"]。
recommenders = ["item-to-item/neighbors", "latest"]

[tracing]

# 启用 REST API 追踪。默认为 false。
enable_tracing = false

# 追踪导出器的类型，取值应为 "zipkin"、"otlp" 或 "otlphttp"。默认为 "otlp"。
exporter = "otlp"

# 追踪收集器的端点。
collector_endpoint = "http://localhost:4317"

# 追踪采样器的类型，取值应为 "always"、"never" 或 "ratio"。默认为 "always"。
sampler = "always"

# 基于比率采样器的采样比率。默认为 1。
ratio = 1

[oidc]

# 启用 OpenID Connect (OIDC) 认证。默认为 false。
enable = false

# OAuth 提供者的颁发者。
issuer = ""

# OAuth 应用的公共标识符。
client_id = ""

# OAuth 应用的访问令牌。
client_secret = ""

# OAuth 提供者在用户成功认证后重定向用户的 URL
# （也称为回调 URL）。应设置为 Gorse 仪表板 URL 与 "/callback/oauth2" 的拼接。
# 例如，如果 Gorse 仪表板 URL 是 http://localhost:8088，
# 则重定向 URL 应为：http://localhost:8088/callback/oauth2
redirect_url = ""

[blob]

# Blob 存储 URI。
#   - S3: s3://bucket/path
#   - GCS: gs://my-bucket/my-database
#   - Azure Blob: az://container/path
#   - 本地: /path/without/prefix
uri = "/var/lib/gorse/blob"

[blob.s3]

# S3 端点。
endpoint = ""

# S3 访问密钥 ID。
access_key_id = ""

# S3 秘密访问密钥。
secret_access_key = ""

[blob.gcs]

# GCS 凭证文件。
credentials_file = ""

[blob.azure]

# Azure Blob 端点。留空则使用 https://<account_name>.blob.core.windows.net/。
endpoint = ""

# Azure 存储账户名称。
account_name = ""

# Azure 存储账户密钥。
account_key = ""

# Azure 存储连接字符串（优先于 account_name/account_key）。
connection_string = ""

[openai]

# OpenAI API 的基础 URL。
base_url = "http://localhost:11434/v1"

# OpenAI API 的密钥。
auth_token = "ollama"

# 聊天补全模型的名称。
chat_completion_model = "qwen2.5"

# 聊天补全每分钟最大请求数。
chat_completion_rpm = 15000

# 聊天补全每分钟最大令牌数。
chat_completion_tpm = 1200000

# 嵌入模型的名称。
embedding_model = "mxbai-embed-large"

# 嵌入向量的维度。
embedding_dimensions = 1024

# 嵌入每分钟最大请求数。
embedding_rpm = 1800

# 嵌入每分钟最大令牌数。
embedding_tpm = 1200000

# OpenAI API 的日志文件。
log_file = "openai.log"
