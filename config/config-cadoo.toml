[database]
cache_store = "postgres://tajian:Postgres@1234@pyramidtip.pg.polardb.rds.aliyuncs.com:5432/recommend?sslmode=disable"
data_store = "postgres://tajian:Postgres@1234@pyramidtip.pg.polardb.rds.aliyuncs.com:5432/recommend?sslmode=disable"

[master]
port = 8086
host = "0.0.0.0"
http_port = 8088
http_host = "0.0.0.0"
n_jobs = 2

[server]
default_n = 20
api_key = "dev-api-key-2026"

[recommend]
cache_size = 100
cache_expire = "72h"
active_user_ttl = 30

[recommend.data_source]
positive_feedback_types = ["like", "match"]
read_feedback_types = ["view", "exposure"]
negative_feedback_types = ["dislike", "block"]
positive_feedback_ttl = 90
item_ttl = 0

[recommend.collaborative]
type = "mf"
fit_period = "30m"
fit_epoch = 50

[recommend.ranker]
type = "fm"
fit_period = "30m"
fit_epoch = 50
recommenders = ["latest", "collaborative", "user-to-user/neighbors"]

[recommend.fallback]
recommenders = ["latest"]

[recommend.user-to-user]
name = "neighbors"
type = "items"

[[recommend.non-personalized]]
name = "popular"
score = "count(feedback, .FeedbackType == 'like')"
filter = "(now() - item.Timestamp).Hours() < 720"

[[recommend.non-personalized]]
name = "cold_start_fresh"
score = "count(feedback, .FeedbackType == 'like')"
filter = "(now() - item.Timestamp).Hours() < 168"

[[recommend.non-personalized]]
name = "cold_start_quality"
score = "count(feedback, .FeedbackType == 'like')"

# 生命周期感知召回池配置
[recommend.lifecycle]
enabled = true
cache_ttl = "5m"

# 冷启动保护池
[[recommend.recall_pools]]
name = "cold_start"
lifecycle_types = ["cold", "light"]
base_weight = 0.8
recommenders = [
  "non-personalized/cold_start_fresh",
  "non-personalized/cold_start_quality",
]
explore_ratio = 0.3

# 行为驱动精准池
[[recommend.recall_pools]]
name = "stable"
lifecycle_types = ["stable", "light"]
base_weight = 0.6
recommenders = [
  "collaborative",
  "user-to-user/neighbors",
  "item-to-item/neighbors",
]
explore_ratio = 0.2

# 疲劳打破池
[[recommend.recall_pools]]
name = "fatigue"
lifecycle_types = ["fatigue"]
base_weight = 0.6
recommenders = [
  "fatigue_breaker",
  "collaborative",
  "latest",
]
explore_ratio = 0.6

# VIP 高价值用户池
[[recommend.recall_pools]]
name = "vip"
lifecycle_types = ["vip"]
base_weight = 0.7
recommenders = [
  "vip_quality_pool",
  "collaborative",
  "social_graph",
]
explore_ratio = 0.1

# 供需平衡配置
[recommend.supply_demand]
enabled = true
redis_addr = "8.148.255.41:6380"
redis_password = "Abcd.1234"
gender_groups = ["M", "F", "O"]
exposure_limits = { F = 100, O = 50 }
low_exposure_threshold = 10
low_exposure_boost = 1.5

# 疲劳打破配置
[recommend.fatigue]
enabled = true
trigger_swipes = 50
trigger_days = 7
random_ratio = 0.3
diversity_cooldown = 3

# 质量过滤配置
[recommend.quality]
enabled = true
redis_addr = "8.148.255.41:6380"
redis_password = "Abcd.1234"
min_like_rate = 0.05
max_block_rate = 0.1

# VIP 用户配置
[recommend.vip]
enabled = true
vip_label_key = "tier"
vip_label_value = "vip"
manual_override = true

# 行为特征配置 (Phase 2)
# 计算用户行为统计并用于探索/利用决策
[recommend.behavior]
enabled = true
redis_addr = "8.148.255.41:6380"
redis_password = "Abcd.1234"
min_swipe_count = 10          # 至少 10 次划卡后才计算统计
stability_window = 20        # 稳定性计算窗口大小
stats_cache_ttl = 300        # Redis 缓存 TTL (秒)
default_explore_ratio = 0.2  # 默认探索比例: 20% 探索

# 物品质量统计配置 (Phase 2)
# 计算被推荐物品的质量指标，用于过滤低质量物品
[recommend.item_stats]
enabled = true
redis_addr = "8.148.255.41:6380"
redis_password = "Abcd.1234"
min_exposure_count = 5       # 至少 5 次曝光后才计算统计
stats_cache_ttl = 600        # Redis 缓存 TTL (秒)
min_like_rate = 0.05         # 最低点赞率，低于此值则过滤
max_block_rate = 0.1        # 最高屏蔽率，高于此值则过滤

# MMR 多样性控制 (Phase 3)
# 使用最大边际相关性 (MMR) 算法，在相关性和多样性之间取得平衡
# Lambda 越大 → 多样性越高，相关性越低
[recommend.mmr]
enabled = true
lambda = 0.3              # 多样性权重 (0-1): 0.3 = 适度多样性
window_size = 10          # 检查与多少个已选物品的相似度
age_decay = 0.2          # 年龄相似惩罚 (0-1)
gender_decay = 0.3        # 性别相同惩罚 (0-1)

# 成功率排序 (Phase 3)
# 基于物品历史点赞率/匹配率提升排序
[recommend.success_rate]
enabled = true
redis_addr = "8.148.255.41:6380"
redis_password = "Abcd.1234"
min_exposures = 10         # 至少曝光次数才计算统计
success_weight = 0.2        # 成功率权重 (0-1)
match_boost = 1.5          # 高匹配率物品的 boost 倍数

# Session 实时疲劳检测 (Phase 3)
# 追踪当前会话的连续无匹配划卡，触发即时多样性提升
[recommend.session_fatigue]
enabled = true
redis_addr = "8.148.255.41:6380"
redis_password = "Abcd.1234"
reset_on_match = true      # 获得 match 后重置计数器
swipe_threshold = 15       # 连续无 match 划卡阈值
recs_threshold = 20         # 推荐曝光阈值
diversity_boost = 0.15    # 疲劳时额外探索比例

# 社交图谱召回 (Phase 4+)
# 自适应策略：稀疏期用 Match-Liked-Overlap，稠密期用 Friends-of-Friends
[recommend.social_graph]
match_threshold = 10           # matches >= 此值切换到 FoF 模式（默认 10）
max_friends = 50              # 最多取多少个匹配用户
fof_max_hops = 2              # FoF 跳数，2 = 启用 FoF
fof_max_friends_per_node = 30 # 每个 1-hop 朋友最多扩展多少 2-hop
match_feedback_type = "match"  # match 事件作为社交边
positive_feedback_types = ["like"]  # 正向互动在图中传播

# 资料驱动匹配 (Phase 4+)
# 基于用户资料偏好（年龄、城市、目的）过滤候选，按资料完整度/活跃度打分
[recommend.profile_match]
min_age = 18                  # 最低年龄
max_age = 65                  # 最高年龄
prefer_verified = true        # 优先推荐已认证用户
score_by = "combined"          # 评分策略: profile_completeness / recency / combined
active_within_days = 30        # 只推荐 N 天内有活跃的用户（0 = 不过滤）
max_results = 200             # 最大候选数量（性能和召回平衡）

# VIP 高质量池 (Phase 4+)
# 为 VIP 用户优先推荐高质量用户：已认证、资料完整、近期活跃、互动指标好
[recommend.vip_quality]
min_quality_score = 0.3       # 最低质量分（0-1）
require_verified = false       # 是否只推荐已认证用户
active_within_days = 7         # 只推荐 N 天内有活跃的用户
score_by = "quality_recency"   # 评分策略: quality / quality_recency / engagement
